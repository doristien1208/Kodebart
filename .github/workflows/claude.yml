name: Claude

# Claude Code GitHub Action（anthropics/claude-code-action@v1）
# 觸發：issue／PR 留言含 @claude、開 issue 時內文含 @claude、或 issue 貼上 `claude` 標籤。
# 只回應對 repo 有寫入權限的使用者（action 預設）。認證用 repo secret：
# CLAUDE_CODE_OAUTH_TOKEN（claude setup-token）或 ANTHROPIC_API_KEY，擇一設定即可。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, labeled]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 同一個 issue／PR 一次只跑一件，避免兩次觸發同時改同一條分支
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Angular 19 需要 Node 18.19+／20.11+／22；先裝好依賴，Claude 才能跑 tsc、ng build、ng test
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: claude
          # 允許驗證指令（型別檢查、建置、單元測試）與 git；其餘沿用 action 預設權限
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(npm ci),Bash(npx tsc:*),Bash(npx ng build:*),Bash(npx ng test:*),Bash(npx ng generate:*),Bash(git:*)"
