<div class="panel">
  <div class="flex flex-col md:flex-row md:justify-between items-start gap-4 mb-6">
    <div>
      <span class="eyebrow">{{ text()?.eyebrow }}</span>
      <h3>{{ text()?.heading }}</h3>
    </div>
    <span class="tag">{{ progressText() }}</span>
  </div>

  <p class="text-muted">{{ text()?.instruction }}</p>

  <app-archive-queue
    [items]="queueItems()"
    [selectedKey]="selected()"
    (select)="select($event)"
  />

  @if (isCase()) {
    @if (caseView(); as cv) {
      <app-case-review
        #caseReview
        [view]="cv"
        [record]="record()"
        [draft]="draft()"
        [done]="caseDone()"
        [error]="caseError()"
        [busy]="busy()"
        [operation]="operation()"
        (toggleMark)="onCaseMark($event)"
        (codeInput)="onCaseCode($event)"
        (decide)="onCaseDecide($event)"
        (policySelect)="setPolicy($event)"
        (confirm)="onCaseConfirm()"
        (retry)="onRetry()"
        (back)="onCaseBack()"
      />
    }
  } @else {
    <app-archive-check-form
      #checkForm
      [record]="record()"
      [draft]="draft()"
      [archived]="done()"
      [fieldError]="fieldError()"
      [preview]="preview()"
      [busy]="busy()"
      [operation]="operation()"
      [helpLabel]="helpLabel()"
      (codeInput)="onInput($event)"
      (policySelect)="setPolicy($event)"
      (validate)="onValidate()"
      (confirm)="onConfirm()"
      (retry)="onRetry()"
      (askHelp)="onAskHelp()"
    />
  }
</div>

<div class="flex gap-2.5 items-center flex-wrap mt-5">
  <p class="text-sm text-muted mb-0">{{ footerText() }}</p>
  <button
    type="button"
    class="btn-primary ml-auto"
    [disabled]="!game.allArchived()"
    (click)="onDeliver()"
  >{{ deliverText() }}</button>
</div>
