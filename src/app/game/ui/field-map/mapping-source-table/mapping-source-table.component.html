<section class="min-w-0">
  <span class="eyebrow">{{ t.sourceEyebrow }}</span>
  <div class="mt-1.5 overflow-x-auto border border-border bg-background">
    <table class="w-full border-collapse text-sm">
      <caption class="sr-only">{{ t.sourceLabel }}</caption>
      <thead>
        <tr>
          @for (field of fields(); track field.id) {
            <th scope="col" class="text-left font-semibold text-muted whitespace-nowrap py-2 px-2.5 border-b border-border">
              {{ field.label }}
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track row.id) {
          <tr>
            @for (field of fields(); track field.id) {
              @let value = row.values[field.id];
              <td class="whitespace-nowrap py-1.5 px-2.5 border-b border-border">
                @if (value === '') {
                  <span class="text-muted">{{ t.blankValue }}</span>
                } @else {
                  {{ value }}
                }
              </td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
