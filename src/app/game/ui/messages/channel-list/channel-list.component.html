<nav class="py-3" [attr.aria-label]="t.listLabel">
  <h3 class="px-4 pb-3 mb-1 text-base font-bold border-b border-border">{{ t.workspace }}</h3>
  @for (section of sections(); track section.kind) {
    <h4 class="px-4 mt-3 mb-1 text-xs font-semibold text-muted" [attr.id]="'channel-section-' + section.kind">
      {{ section.title }}
    </h4>
    @if (section.items.length === 0) {
      <p class="px-4 text-sm text-muted m-0">{{ t.sectionEmpty }}</p>
    } @else {
      <ul role="list" class="list-none p-0 m-0" [attr.aria-labelledby]="'channel-section-' + section.kind">
        @for (item of section.items; track item.id) {
          @let selected = item.id === selectedId();
          <li class="min-w-0">
            <button
              type="button"
              class="w-full flex items-start gap-2.5 py-2 pl-3.5 pr-3 border-0 border-l-2"
              [class.border-l-primary]="selected"
              [class.bg-elevated]="selected"
              [class.border-l-transparent]="!selected"
              [class.bg-transparent]="!selected"
              [class.hover:bg-surface]="!selected"
              [attr.data-channel-id]="item.id"
              [attr.aria-current]="selected ? 'true' : null"
              (click)="select.emit(item.id)"
            >
              @if (item.kind === 'direct') {
                <span
                  aria-hidden="true"
                  class="inline-flex items-center justify-center size-6 shrink-0 mt-0.5 bg-elevated border border-border text-primary text-xs font-semibold"
                  >{{ item.initial }}</span
                >
              } @else {
                <span aria-hidden="true" class="inline-flex items-center justify-center size-6 shrink-0 mt-0.5 font-mono text-muted">#</span>
              }
              <span class="flex-1 min-w-0">
                <span class="flex items-baseline gap-2">
                  <span class="flex-1 min-w-0 truncate" [class.font-semibold]="item.unread > 0">{{ item.title }}</span>
                  <span class="shrink-0 font-mono text-xs text-muted">{{ item.time }}</span>
                </span>
                <span class="flex items-center gap-2">
                  <span class="flex-1 min-w-0 truncate text-sm text-muted" data-channel-preview>{{ item.preview }}</span>
                  <app-unread-badge [count]="item.unread" [label]="item.unreadLabel" />
                </span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  }
</nav>
