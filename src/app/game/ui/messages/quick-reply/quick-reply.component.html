<section [attr.aria-labelledby]="'quick-reply-heading-' + promptId()" [attr.data-prompt-id]="promptId()">
  <h4 [id]="'quick-reply-heading-' + promptId()" class="m-0 mb-2 text-xs font-semibold text-muted">
    {{ t.quickReplyHeading }}
  </h4>
  <div class="flex flex-wrap gap-2 min-w-0">
    @for (choice of choices(); track choice.id) {
      <button
        type="button"
        class="max-w-full min-w-0 py-2 [overflow-wrap:anywhere]"
        [attr.data-choice-id]="choice.id"
        (click)="choose.emit(choice.id)"
      >
        {{ choice.text }}
      </button>
    }
    <button type="button" class="btn-ghost max-w-full py-2 text-muted" data-skip-reply (click)="skip.emit()">
      {{ t.skipReply }}
    </button>
  </div>
</section>
