<div class="source">
  <div class="eyebrow">{{ t.eyebrow(record().key) }}</div>
  <dl>
    <dt>{{ t.name }}</dt>
    <dd>{{ nameText() }}</dd>
    <dt>{{ t.code }}</dt>
    <dd class="font-mono">{{ record().code }}</dd>
    @if (record().refusalApplies) {
      <dt>{{ t.arrangement }}</dt>
      <dd data-source-arrangement>{{ t.arrangementValue }}</dd>
    }
    <dt>{{ t.refusal }}</dt>
    <dd [attr.aria-describedby]="refusalMissing() ? missingNoteId : null">{{ refusalText() }}</dd>
  </dl>
  @if (refusalMissing()) {
    <p [id]="missingNoteId" class="mt-1 mb-0 text-sm text-muted" data-source-missing-note>{{ t.missingNote }}</p>
  }
</div>
