<div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 mb-4">
  <span #current tabindex="-1" class="font-mono text-primary whitespace-nowrap" data-step>{{ step() }}</span>
  <ol [attr.aria-label]="ui.listLabel" class="list-none m-0 p-0 flex flex-wrap gap-2 min-w-0">
    @for (t of tasks(); track t.taskId) {
      <li
        class="flex items-center gap-2 min-w-0 max-w-full px-2.5 py-1 border text-sm"
        [class.border-primary]="t.status === 'active'"
        [class.bg-elevated]="t.status === 'active'"
        [class.border-border]="t.status !== 'active'"
        [attr.aria-current]="t.status === 'active' ? 'step' : null"
        [attr.data-task-status]="t.status"
      >
        <span class="font-mono text-muted">{{ t.index }}</span>
        <span class="text-muted whitespace-nowrap">{{ kindLabel(t.kind) }}</span>
        <span class="truncate">{{ t.heading }}</span>
        <span class="whitespace-nowrap" [class.text-primary]="t.status === 'active'" [class.text-muted]="t.status !== 'active'">{{ statusLabel(t.status) }}</span>
      </li>
    }
  </ol>
</div>
